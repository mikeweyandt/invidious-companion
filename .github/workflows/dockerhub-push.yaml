name: Push to Docker Hub

# Manual only: run from the Actions tab or with
#   gh workflow run dockerhub-push.yaml [--ref <branch>] [-f tag=<tag>]
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME - Docker Hub account name
#   DOCKERHUB_TOKEN    - Docker Hub access token with write access
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to push (in addition to the date-sha tag)"
        required: false
        default: "latest"

env:
  IMAGE_NAME: invidious-companion

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix={{date 'YYYY.MM.DD'}}-
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            "CHECK_CHECKSUMS=1"
